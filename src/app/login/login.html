<div class="login-page">

  <div class="login-card">

    <h1>SplitRoom</h1>
    <p>Manage shared expenses with your roommates.</p>

    <form (ngSubmit)="login()">

      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />

      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      />

      <button type="submit">Login</button>

      <p class="message">{{ message }}</p>

    </form>

  </div>

</div>
