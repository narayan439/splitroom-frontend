@if (isAuthenticated) {
<header class="site-header">
  <a aria-label="SplitRoom home" class="brand" routerLink="/" (click)="closeMenu()">
    <span aria-hidden="true" class="brand__mark">
      <svg viewBox="0 0 32 32">
        <path d="M16 4.5 27 10.8v10.4L16 27.5 5 21.2V10.8L16 4.5Z"></path>
        <path d="m5.5 11 10.5 6 10.5-6M16 17v10"></path>
      </svg>
    </span>
    <span>Split<span class="brand__accent">Room</span></span>
  </a>

  <button
    #menuButton
    type="button"
    class="menu-toggle"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
    [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="toggleMenu()"
  >
    @if (menuOpen) {
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </svg>
    } @else {
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    }
  </button>

  <nav
    id="primary-navigation"
    aria-label="Main navigation"
    class="primary-navigation"
    [class.primary-navigation--open]="menuOpen"
  >
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect>
      </svg>
      Dashboard
    </a>
    <a routerLink="/expenses" routerLinkActive="active" (click)="closeMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 5.5h16v13H4zM4 9h16M8 14h3"></path>
      </svg>
      Expenses
    </a>
    <a routerLink="/my-expenses" routerLinkActive="active" (click)="closeMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M6 5.5h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Zm0 4h12M9 3.5v4M15 3.5v4"></path>
      </svg>
      My expenses
    </a>
    <a
      href="/add-expense"
      [attr.aria-disabled]="expenseNavigationLoading"
      (click)="openAddExpense($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      {{ expenseNavigationLoading ? 'Opening…' : 'Add Expense' }}
    </a>
    <a routerLink="/roommates" routerLinkActive="active" (click)="closeMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3.5 19v-1a5.5 5.5 0 0 1 11 0v1zM16 5.5a3 3 0 0 1 0 5.8M17 14a4.5 4.5 0 0 1 3.5 4.4v.6h-3"></path>
      </svg>
      Roommates
    </a>
    <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
      </svg>
      Profile
    </a>
    <button type="button" class="logout-link" (click)="logout()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M10 5H5.5A1.5 1.5 0 0 0 4 6.5v11A1.5 1.5 0 0 0 5.5 19H10M14 16l4-4-4-4M18 12H9"></path>
      </svg>
      Sign out
    </button>
  </nav>
</header>
}

@if (isAuthenticated && expenseNavigationError) {
  <p class="navigation-error" role="alert">{{ expenseNavigationError }}</p>
}

<main class="route-content">
  <router-outlet></router-outlet>
</main>
