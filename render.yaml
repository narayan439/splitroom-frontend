services:
  - type: web
    name: splitroom-api
    runtime: docker
    rootDir: splitroom-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_SWAGGER_ENABLED
        value: 'false'
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: splitroom-frontend
    runtime: static
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/splitroom-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: RENDER_BACKEND_URL
        sync: false
