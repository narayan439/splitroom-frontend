spring.application.name=backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/splitroom_db1
spring.datasource.username=root
spring.datasource.password=541294

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Server
server.port=8080

# Security. Provide APP_JWT_SECRET as Base64 encoding of at least 32 random bytes.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201}
app.swagger.enabled=${APP_SWAGGER_ENABLED:false}